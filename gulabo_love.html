<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For My Gulabo 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@500;600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#1a0010;}
#app{width:100%;height:100vh;position:relative;overflow:hidden;}
.page{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.5rem;
  opacity:0;pointer-events:none;transform:translateY(40px);
  transition:opacity 0.6s ease,transform 0.6s ease;
  z-index:1;
}
.page.active{opacity:1;pointer-events:all;transform:translateY(0);}
.page.exit{opacity:0;transform:translateY(-40px);}

/* BG canvas */
canvas#hearts-bg{position:fixed;inset:0;z-index:0;}

/* Page 1 */
#page1{background:linear-gradient(160deg,#3d0020,#1a0010 60%,#200030);}
.p1-decor{font-size:3rem;margin-bottom:1.2rem;animation:float 3s ease-in-out infinite;}
.p1-sorry{font-family:'Dancing Script',cursive;font-size:1.35rem;color:#ffcce0;letter-spacing:0.03em;margin-bottom:0.5rem;text-align:center;}
.p1-title{font-family:'Playfair Display',serif;font-size:2.4rem;font-style:italic;color:#ff6699;text-align:center;line-height:1.25;margin-bottom:0.6rem;}
.p1-sub{font-family:'Dancing Script',cursive;font-size:1.6rem;color:#ffaacc;text-align:center;margin-bottom:2.5rem;}

/* Page 2 */
#page2{background:linear-gradient(160deg,#1a0010,#0d0020 60%,#250010);}
.photo-frame{
  width:100%;max-width:320px;
  border-radius:20px;overflow:hidden;
  border:2px solid rgba(255,100,150,0.4);
  box-shadow:0 0 40px rgba(255,60,120,0.3),0 0 80px rgba(255,30,90,0.15);
  margin-bottom:1.6rem;flex-shrink:0;
}
.photo-frame img{width:100%;display:block;object-fit:cover;transform:rotate(90deg) scale(1.3);transform-origin:center center;}

/* fix rotated photo */
.photo-wrap{width:100%;max-width:340px;height:200px;overflow:hidden;border-radius:20px;border:2px solid rgba(255,100,150,0.4);box-shadow:0 0 40px rgba(255,60,120,0.3);margin-bottom:1.6rem;flex-shrink:0;position:relative;}
.photo-wrap img{position:absolute;width:100%;left:0;top:0;object-fit:cover;object-position:center top;}

.p2-verse{
  font-family:'Playfair Display',serif;font-size:1.05rem;font-style:italic;
  color:#ffcce0;text-align:center;line-height:1.7;
  padding:0 0.5rem;margin-bottom:2rem;
}

/* Page 3 */
#page3{background:linear-gradient(160deg,#0d0020,#1a0010 50%,#0d0020);}
.p3-question{font-family:'Dancing Script',cursive;font-size:2rem;color:#ff6699;text-align:center;margin-bottom:0.5rem;}
.p3-sub{font-family:'Lato',sans-serif;font-size:0.85rem;color:rgba(255,180,200,0.6);text-align:center;margin-bottom:2.5rem;}
.btn-area{position:relative;width:100%;height:160px;display:flex;align-items:center;justify-content:center;gap:2rem;}

/* Page 4 */
#page4{background:linear-gradient(160deg,#1a0010,#0a001a 50%,#1a0010);}
.p4-title{font-family:'Playfair Display',serif;font-size:1.7rem;font-style:italic;color:#ff6699;text-align:center;line-height:1.4;margin-bottom:0.4rem;}
.p4-name{font-family:'Dancing Script',cursive;font-size:2.4rem;color:#ffaacc;text-align:center;font-weight:700;}
.p4-heart{font-size:3rem;text-align:center;margin:1rem 0;animation:heartbeat 1s ease-in-out infinite;}

/* Buttons */
.btn-next{
  background:linear-gradient(135deg,#cc2255,#ff4488);
  color:white;font-family:'Lato',sans-serif;font-weight:400;
  font-size:1rem;letter-spacing:0.05em;
  padding:0.8rem 2.5rem;border:none;border-radius:50px;cursor:pointer;
  box-shadow:0 4px 20px rgba(255,60,120,0.4);
  transition:transform 0.2s,box-shadow 0.2s;
}
.btn-next:active{transform:scale(0.96);}
.btn-yes{
  background:linear-gradient(135deg,#aa1144,#ff3377);
  color:white;font-family:'Lato',sans-serif;font-weight:400;
  font-size:1rem;padding:0.8rem 1.8rem;border:none;border-radius:50px;cursor:pointer;
  box-shadow:0 4px 20px rgba(255,50,120,0.4);
  transition:transform 0.2s;position:absolute;
}
.btn-yes:active{transform:scale(0.96);}
.btn-no{
  background:rgba(255,255,255,0.08);
  color:rgba(255,200,220,0.7);font-family:'Lato',sans-serif;
  font-size:0.95rem;padding:0.75rem 1.5rem;border:1px solid rgba(255,100,150,0.25);
  border-radius:50px;cursor:pointer;transition:transform 0.15s;
  position:absolute;
}

/* Floating hearts for page 4 */
.heart-pop{
  position:fixed;pointer-events:none;font-size:1.5rem;
  animation:popFloat 2s ease-out forwards;z-index:10;
}
@keyframes popFloat{
  0%{opacity:1;transform:translateY(0) scale(0.5);}
  100%{opacity:0;transform:translateY(-200px) scale(1.5);}
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes heartbeat{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
@keyframes shimmer{0%,100%{opacity:0.7;}50%{opacity:1;}}
.petal{position:fixed;pointer-events:none;font-size:1.2rem;animation:petalFall linear forwards;z-index:0;}
@keyframes petalFall{0%{opacity:1;transform:translateY(-20px) rotate(0deg);}100%{opacity:0;transform:translateY(100vh) rotate(360deg);}}
</style>
</head>
<body>

<canvas id="hearts-bg"></canvas>
<div id="app">

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <div class="p1-decor">🌹</div>
  <p class="p1-sorry">a message from the heart...</p>
  <h1 class="p1-title">Sorry<br/>meri gulabo</h1>
  <p class="p1-sub">your grampzilla loves you a tonne 💕</p>
  <button class="btn-next" onclick="goTo(2)">Next &nbsp;→</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">
  <div class="photo-wrap">
    <img id="gf-photo" alt="my love" />
  </div>
  <p class="p2-verse">
    tu tulsi ke patte se<br/>
    pavitra hai<br/>
    res toh pyaar mein<br/>
    hua samarpanwa 🌿
  </p>
  <button class="btn-next" onclick="goTo(3)">Next &nbsp;→</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page">
  <p class="p3-question">apologies accepted??</p>
  <p class="p3-sub">choose wisely 😇</p>
  <div class="btn-area" id="btnArea">
    <button class="btn-yes" id="yesBtn" onclick="goTo(4)">yes, ilysm 🥰</button>
    <button class="btn-no" id="noBtn">no</button>
  </div>
</div>

<!-- PAGE 4 -->
<div id="page4" class="page">
  <div class="p4-heart" id="bigHeart">❤️</div>
  <p class="p4-title">Ni loves being loved</p>
  <p class="p4-title">by his</p>
  <p class="p4-name">Kishu 💕</p>
</div>

</div>

function goTo(n) {
  document.querySelectorAll('.page').forEach(p => {
    if (p.classList.contains('active')) {
      p.classList.add('exit');
      setTimeout(() => p.classList.remove('active','exit'), 600);
    }
  });
  setTimeout(() => {
    const next = document.getElementById('page' + n);
    next.classList.add('active');
    if (n === 4) startHeartRain();
  }, 300);
}

// Running NO button
const noBtn = document.getElementById('noBtn');
const area = document.getElementById('btnArea');
const yesBtn = document.getElementById('yesBtn');
let noPosX = 60, noPosY = 80;
yesBtn.style.left = '20px';
yesBtn.style.top = '50px';
noBtn.style.right = '20px';
noBtn.style.top = '50px';

function runAway(e) {
  const rect = area.getBoundingClientRect();
  const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
  const maxX = rect.width - bw - 10, maxY = rect.height - bh - 10;
  let nx, ny, attempts = 0;
  do {
    nx = Math.random() * maxX;
    ny = Math.random() * maxY;
    attempts++;
  } while (attempts < 20 && Math.hypot(nx - noPosX, ny - noPosY) < 60);
  noPosX = nx; noPosY = ny;
  noBtn.style.right = 'auto';
  noBtn.style.left = nx + 'px';
  noBtn.style.top = ny + 'px';
  noBtn.style.transition = 'left 0.2s,top 0.2s';
}
noBtn.addEventListener('mousemove', runAway);
noBtn.addEventListener('touchstart', e => { e.preventDefault(); runAway(e); }, {passive:false});
noBtn.addEventListener('click', e => { e.preventDefault(); runAway(e); });

// Heart rain animation
function startHeartRain() {
  const emojis = ['❤️','🌹','💕','💖','💗','💓','🌸','💝'];
  function spawnHeart() {
    const h = document.createElement('div');
    h.className = 'heart-pop';
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    h.style.left = Math.random() * 90 + '%';
    h.style.bottom = Math.random() * 30 + '%';
    h.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
    h.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 3000);
  }
  const iv = setInterval(spawnHeart, 200);
  setTimeout(() => clearInterval(iv), 5000);
  setInterval(spawnHeart, 800);
}

  size: 6 + Math.random()*10,
  speed: 0.2 + Math.random()*0.4,
  opacity: 0.05 + Math.random()*0.1,
  drift: (Math.random()-0.5)*0.3
}));
function drawHeart(cx,cy,s,op){
  ctx.save();ctx.globalAlpha=op;ctx.fillStyle='#ff4477';
  ctx.beginPath();
  ctx.moveTo(cx,cy-s*0.3);
  ctx.bezierCurveTo(cx,cy-s*0.6,cx+s*0.6,cy-s*0.6,cx+s*0.6,cy-s*0.1);
  ctx.bezierCurveTo(cx+s*0.6,cy+s*0.3,cx,cy+s*0.6,cx,cy+s*0.7);
  ctx.bezierCurveTo(cx,cy+s*0.6,cx-s*0.6,cy+s*0.3,cx-s*0.6,cy-s*0.1);
  ctx.bezierCurveTo(cx-s*0.6,cy-s*0.6,cx,cy-s*0.6,cx,cy-s*0.3);
  ctx.fill();ctx.restore();
}
function anim(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  particles.forEach(p=>{
    drawHeart(p.x,p.y,p.size,p.opacity);
    p.y -= p.speed; p.x += p.drift;
    if(p.y < -30){p.y=cvs.height+30;p.x=Math.random()*cvs.width;}
  });
  requestAnimationFrame(anim);
}
anim();
</script>
</body>
